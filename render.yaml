# Render Blueprint: New → Blueprint → pick this repo → Apply.
# Paste the Supabase "Session pooler" connection string into DATABASE_URL when asked.
services:
  - type: web
    name: p1-maintenance-dashboard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TZ
        value: Asia/Bangkok
      - key: NODE_VERSION
        value: "22"
